grafana:
  adminPassword: changeme
  persistence:
    enabled: false
  defaultDashboardsEnabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by:
      - alertname
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      routes:
      - receiver: "null"
        matchers:
        - severity = critical
        - custom = "true"
    receivers:
    - name: "null"
    - name: telegram
      webhook_configs:
      - url: http://alertmanager-telegram-bot:9087/alert
        send_resolved: true
    templates:
    - /etc/alertmanager/config/*.tmpl

additionalPrometheusRulesMap:
  demo-app-alerts:
    groups:
      - name: demo-app
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="demo"}[5m]) * 60 > 0
            for: 1m
            labels:
              severity: critical
              custom: "true"
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently."
      - name: cluster
        rules:
          - alert: HighNodeCPU
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
            for: 2m
            labels:
              severity: warning
              custom: "true"
            annotations:
              summary: "High CPU on {{ $labels.instance }}"
              description: "Node CPU usage is above 80% for 2 minutes."

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
