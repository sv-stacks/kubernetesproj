apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telegram-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sv-stacks/kubernetesproj
    targetRevision: HEAD
    path: alertmanager
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
